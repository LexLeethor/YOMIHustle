<!doctype html>
<meta charset="utf-8" />
<title>wisp latency</title>
<style>
  body { background: #0b0f0d; color: #d8e7dd; font: 12px/1.5 ui-monospace, monospace; margin: 0; padding: 14px; }
  table { border-collapse: collapse; }
  td, th { padding: 2px 10px 3px 0; text-align: left; }
</style>
<table id="tbl"></table>
<pre id="out"></pre>
<!-- multiplayer.js routes the relay through ?wisp=<url> using epoxy, so this measures the
     exact path the game plays on. -->
<script src="multiplayer.js"></script>
<script type="module">
  const params = new URLSearchParams(location.search);
  const ROUNDS = Math.max(3, parseInt(params.get("rounds") || "10", 10));
  const TARGET = window.YOMI_RELAY_URL;
  const results = [];
  window.__latency = { done: false, results };

  const out = document.getElementById("out");
  const log = (line) => {
    out.textContent += line + "\n";
    console.log("[latency] " + line);
  };
  const median = (values) => {
    const sorted = [...values].sort((a, b) => a - b);
    return sorted.length ? sorted[Math.floor(sorted.length / 2)] : NaN;
  };
  const round = (value) => (Number.isFinite(value) ? Math.round(value) : NaN);

  // Opens the relay, then times ROUNDS fetch_player_count round trips on it.
  function measure(label, target, Socket = window.WebSocket) {
    return new Promise((resolve) => {
      const started = performance.now();
      const samples = [];
      let sentAt = 0;
      let opened = false;
      const socket = new Socket(target);
      const finish = () => {
        try { socket.close(1000, "done"); } catch {}
        resolve({ label, target, connectMs: opened ? connectMs : NaN, rtts: samples, tunnel: socket.tunnel || "" });
      };
      let connectMs = NaN;
      const timer = setTimeout(finish, 30000);
      const pump = () => {
        if (samples.length >= ROUNDS) {
          clearTimeout(timer);
          return finish();
        }
        sentAt = performance.now();
        socket.send('{"type":"fetch_player_count"}');
      };
      socket.onopen = () => {
        opened = true;
        connectMs = performance.now() - started;
        pump();
      };
      socket.onmessage = (event) => {
        const text = typeof event.data === "string" ? event.data : new TextDecoder().decode(new Uint8Array(event.data));
        if (text.indexOf("player_count") === -1) return;
        if (sentAt) samples.push(performance.now() - sentAt);
        pump();
      };
      socket.onerror = () => {
        clearTimeout(timer);
        try { socket.close(); } catch {}
        resolve({ label, target, error: "socket error" });
      };
    });
  }

  function render() {
    const rows = results
      .map((entry) => {
        if (entry.error) return `<tr><td>${entry.label}</td><td colspan="6">${entry.error}</td></tr>`;
        const rtts = entry.rtts || [];
        return `<tr><td>${entry.label}</td><td>${round(entry.connectMs)}</td><td>${rtts.length}</td><td>${round(Math.min(...rtts))}</td><td>${round(median(rtts))}</td><td>${round(Math.max(...rtts))}</td><td>${entry.tunnel || "-"}</td></tr>`;
      })
      .join("");
    document.getElementById("tbl").innerHTML =
      "<tr><th>path</th><th>connect</th><th>samples</th><th>min rtt</th><th>median</th><th>max</th><th>tunnel</th></tr>" + rows;
  }

  log("relay " + TARGET);
  log("wisp  " + (window.YOMI_WISP_URL || "(none, direct)"));

  // Same relay without the tunnel, using the browser's own socket.
  const measureDirect = () => measure("direct", TARGET, window.YOMI_NATIVE_WEBSOCKET || WebSocket);
  // ?first=direct puts the no-tunnel path first, which shows whether a slow first reply is
  // the relay waking up or the tunnel itself.
  if (params.get("first") === "direct") {
    const early = await measureDirect();
    results.push(early);
    render();
    log(JSON.stringify(early));
  }

  const tunneled = await measure("via wisp", TARGET);
  results.push(tunneled);
  render();
  log(JSON.stringify(tunneled));

  if (params.get("first") !== "direct") {
    const direct = await measureDirect();
    results.push(direct);
    render();
    log(JSON.stringify(direct));
  }

  window.__latency.done = true;
  log("done");
</script>
